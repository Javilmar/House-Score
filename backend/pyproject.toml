[project]
name = "housescore-backend"
version = "0.1.0"
description = "API + base de datos de HouseScore"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "slowapi>=0.1.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Los property_scorer_*.py son el scorer heredado, copiado casi tal cual (solo cambia la
# lectura de historial y la publicacion): no se reformatean para mantener el diff legible
extend-exclude = ["alembic/versions", "worker/scraper/property_scorer_*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
